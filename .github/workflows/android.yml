name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
      - "icon-192.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Prepare launcher icon
        run: |
          mkdir -p app-android/app/src/main/res/drawable
          cp icon-192.png app-android/app/src/main/res/drawable/ic_launcher.png

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: app-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app-android/app/build/outputs/apk/debug/app-debug.apk yunyin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yunyin-apk
          path: yunyin.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" yunyin.apk \
            --title "云音 Android $TAG" \
            --notes "云音播放器 Android 安装包（WebView 壳）。下载 yunyin.apk 安装即可，首次安装需允许「安装未知来源应用」。"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
