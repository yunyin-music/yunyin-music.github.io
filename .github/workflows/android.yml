name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
      - "icon-192.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Ensure stable signing keystore
        run: |
          if [ ! -f .keys/yunyin.jks ]; then
            mkdir -p .keys
            keytool -genkeypair -v -keystore .keys/yunyin.jks \
              -storepass yunyin123 -keypass yunyin123 -alias yunyin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Yunyin, O=Yunyin, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keys/yunyin.jks
            git commit -m "chore: add stable signing keystore"
            git push
          else
            echo "keystore exists"
          fi

      - name: Build debug APK
        working-directory: app-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/aapt" dump badging app-android/app/build/outputs/apk/debug/app-debug.apk | head -12
          "$BT/apksigner" verify --print-certs app-android/app/build/outputs/apk/debug/app-debug.apk | head -4

      - name: Rename APK
        run: cp app-android/app/build/outputs/apk/debug/app-debug.apk yunyin.apk

      - name: Publish APK to site
        run: |
          mkdir -p download
          cp yunyin.apk download/yunyin.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/yunyin.apk
          if git diff --cached --quiet; then
            echo "apk unchanged"
          else
            git commit -m "chore: update android apk"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: yunyin-apk
          path: yunyin.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" yunyin.apk \
            --title "云音 Android $TAG" \
            --notes "云音播放器 Android 安装包（WebView 壳）。下载 yunyin.apk 安装即可，首次安装需允许「安装未知来源应用」。"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
