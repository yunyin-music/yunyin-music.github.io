<style>
  :root{
    --bg-0:#09090b;
    --bg-1:#121214;
    --bg-2:#18181b;
    --glass:rgba(255,255,255,.035);
    --glass-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.12);
    --text:#f4f4f5;
    --text-2:#a1a1aa;
    --text-3:#6b6b73;
    --accent:#a78bfa;
    --accent-2:#c4b5fd;
    --accent-glow:rgba(167,139,250,.35);
    --danger:#f87171;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 16px 50px rgba(0,0,0,.55);
    --shadow-soft:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
    background:var(--bg-0);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    letter-spacing:.1px;
  }
  /* animated background mesh */
  .bg-mesh{
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(1000px 700px at 12% 18%, rgba(167,139,250,.14), transparent 60%),
      radial-gradient(900px 800px at 88% 12%, rgba(124,58,237,.10), transparent 60%),
      radial-gradient(1000px 900px at 70% 92%, rgba(167,139,250,.08), transparent 60%),
      linear-gradient(160deg,#09090b 0%,#0e0e10 50%,#09090b 100%);
  }
  .bg-noise{
    position:fixed;inset:0;z-index:-1;opacity:.035;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .app{
    display:grid;
    grid-template-columns:260px 1fr;
    grid-template-rows:1fr auto;
    height:100vh;
    height:100dvh; /* iOS Safari 动态视口：地址栏收起/展开时高度自适应，播放栏不被遮挡 */
    gap:14px;
    padding:14px 14px 0 14px;
  }
  html{-webkit-text-size-adjust:100%}
  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  /* iOS 惯性滚动：长列表/歌词区丝滑 */
  .song-list,.side-scroll,.q-list,.pp-lyrics,.charts{-webkit-overflow-scrolling:touch}
  /* ---------- Sidebar ---------- */
  .sidebar{
    grid-row:1;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 14px;
    display:flex;flex-direction:column;gap:16px;
    backdrop-filter:blur(24px) saturate(1.2);
    -webkit-backdrop-filter:blur(24px) saturate(1.2);
    box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.05);
    overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{width:5px}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
  .side-scroll{display:flex;flex-direction:column;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3);
    font-size:20px;color:#0a0a0b;
  }
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.5px}
  .brand h1 span{color:var(--accent)}
  .brand small{display:block;font-size:10px;color:var(--text-3);letter-spacing:1px;margin-top:1px}

  .search{position:relative}
  .search input{
    width:100%;background:var(--bg-2);border:1px solid var(--border);
    color:var(--text);padding:10px 12px 10px 36px;border-radius:var(--radius-sm);
    font-size:13px;outline:none;transition:.2s cubic-bezier(.4,0,.2,1);
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);background:var(--bg-1)}
  .search input::placeholder{color:var(--text-3)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}

  .nav-label{font-size:11px;color:var(--text-3);letter-spacing:2px;padding:0 6px;margin-bottom:-8px}
  .charts{display:flex;flex-direction:column;gap:4px;padding-right:4px}
  .charts::-webkit-scrollbar{width:5px}
  .charts::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
  .chart-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;
    transition:.22s cubic-bezier(.4,0,.2,1);color:var(--text-2);font-size:13.5px;font-weight:500;
    position:relative;
  }
  .chart-item:hover{background:var(--glass-2);color:var(--text)}
  .chart-item.active{
    background:linear-gradient(90deg,rgba(167,139,250,.18),rgba(167,139,250,.03));
    color:var(--text);
  }
  .chart-item.active::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
    background:var(--accent);border-radius:3px;box-shadow:0 0 10px var(--accent);
  }
  .chart-item .ico{
    width:28px;height:28px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--glass-2);font-size:14px;
  }
  .chart-item.active .ico{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0a0b}
  .chart-item .cnt{margin-left:auto;font-size:10px;color:var(--text-3)}

  .sidebar-foot{
    font-size:10px;color:var(--text-3);text-align:center;line-height:1.6;
    padding-top:10px;border-top:1px solid var(--border);
  }
  .sidebar-foot a{color:var(--accent);text-decoration:none}

  /* ---------- Main ---------- */
  .main{
    grid-row:1;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    display:flex;flex-direction:column;
    backdrop-filter:blur(24px) saturate(1.2);
    -webkit-backdrop-filter:blur(24px) saturate(1.2);
    box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    position:relative;
  }
  .chart-header{
    padding:22px 26px 18px;
    display:flex;align-items:flex-end;gap:20px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(167,139,250,.06),transparent);
  }
  .chart-cover{
    width:120px;height:120px;border-radius:16px;
    background:linear-gradient(135deg,#27272a,#18181b);
    box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px var(--border),inset 0 1px 0 rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    flex-shrink:0;overflow:hidden;
  }
  .chart-cover img{width:100%;height:100%;object-fit:cover}
  .chart-meta .tag{
    display:inline-block;font-size:10px;letter-spacing:1.5px;color:var(--accent);
    background:rgba(167,139,250,.12);padding:3px 9px;border-radius:20px;margin-bottom:8px;
  }
  .chart-meta h2{font-size:28px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
  .chart-meta p{font-size:12px;color:var(--text-2);max-width:520px;line-height:1.6}
  .chart-actions{margin-left:auto;display:flex;gap:10px}
  .btn-play-all{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0a0a0b;font-weight:700;font-size:13px;
    border:none;padding:10px 22px;border-radius:30px;cursor:pointer;
    box-shadow:0 6px 20px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25);
    transition:.2s cubic-bezier(.4,0,.2,1);
  }
  .btn-play-all:hover{transform:translateY(-1px);box-shadow:0 10px 28px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3)}

  .song-list{flex:1;overflow-y:auto;padding:8px 10px 14px}
  .song-list::-webkit-scrollbar{width:7px}
  .song-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
  .song-list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}

  .song-row{
    display:grid;
    grid-template-columns:36px 1fr 140px 90px 56px;
    align-items:center;gap:12px;
    padding:10px 14px;border-radius:10px;cursor:pointer;
    transition:.2s cubic-bezier(.4,0,.2,1);color:var(--text-2);
    border:1px solid transparent;
  }
  .song-row:hover{background:var(--glass-2);color:var(--text);border-color:var(--border)}
  .song-row.playing{background:rgba(167,139,250,.08);color:var(--text);border-color:rgba(167,139,250,.18)}
  .song-row .idx{font-size:12px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
  .song-row .idx.top{color:var(--accent);font-weight:700}
  .song-row:hover .idx .num{display:none}
  .song-row:hover .idx .play-mini{display:inline}
  .idx .play-mini{display:none;color:var(--accent)}
  .song-row.playing .idx .num{display:none}
  .song-row.playing .idx .playing-anim{display:inline-flex}
  .idx .playing-anim{display:none;align-items:flex-end;gap:2px;height:14px}
  .idx .playing-anim span{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .idx .playing-anim span:nth-child(1){height:60%;animation-delay:-.4s}
  .idx .playing-anim span:nth-child(2){height:100%;animation-delay:-.2s}
  .idx .playing-anim span:nth-child(3){height:40%}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  .song-info{display:flex;align-items:center;gap:11px;min-width:0}
  .song-info .thumb{width:40px;height:40px;border-radius:8px;background:var(--bg-2);flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.3),0 0 0 1px var(--border)}
  .song-info .thumb img{width:100%;height:100%;object-fit:cover}
  .song-info .meta{min-width:0}
  .song-info .title{font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .song-row.playing .song-info .title{color:var(--accent)}
  .song-info .artist{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .song-row .album{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .song-row .duration{font-size:12px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
  .song-row .more{transition:.15s;display:flex;justify-content:flex-end;color:var(--text-3)}
  .song-row .more:hover{color:var(--accent)}

  /* skeleton / loading */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;gap:14px}
  .spinner{width:34px;height:34px;border:3px solid var(--glass-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader p{font-size:12px;color:var(--text-3);letter-spacing:1px}
  .empty{text-align:center;padding:60px 20px;color:var(--text-3)}
  .empty svg{margin-bottom:12px;opacity:.5}

  /* ---------- Player bar ---------- */
  .player{
    grid-column:1 / -1;
    background:rgba(14,14,16,.82);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 20px;
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    align-items:center;gap:16px;
    backdrop-filter:blur(28px) saturate(1.3);
    -webkit-backdrop-filter:blur(28px) saturate(1.3);
    box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .p-left{display:flex;align-items:center;gap:12px;min-width:0}
  .vinyl{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:
      radial-gradient(circle at center,#1f1f23 0 6px,#2a2a2f 6px 9px,#1f1f23 9px 13px,#2a2a2f 13px 17px,#1f1f23 17px 22px,#09090b 22px);
    border:2px solid #000;
    box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05);
    position:relative;overflow:hidden;
  }
  .vinyl img{position:absolute;inset:13px;border-radius:50%;object-fit:cover}
  .vinyl.spinning{animation:spin 8s linear infinite;box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06),0 0 14px var(--accent-glow)}
  .p-left .vinyl{cursor:pointer;transition:box-shadow .25s}
  .p-left .vinyl:hover{box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1),0 0 16px var(--accent-glow)}
  .p-info{min-width:0}
  .p-info .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-info .a{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .p-center{display:flex;flex-direction:column;align-items:center;gap:6px}
  .controls{display:flex;align-items:center;gap:18px}
  .ctrl-btn{
    background:none;border:none;color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.2s cubic-bezier(.4,0,.2,1);
    padding:6px;border-radius:50%;
  }
  .ctrl-btn:hover{color:var(--text);transform:scale(1.08)}
  .ctrl-btn.play{
    width:42px;height:42px;background:#fff;color:#09090b;border-radius:50%;
    box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.1);
  }
  .ctrl-btn.play:hover{transform:scale(1.06);background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.5)}
  .ctrl-btn.active{color:var(--accent)}

  .progress{display:flex;align-items:center;gap:10px;width:100%;max-width:560px}
  .time{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;width:38px;text-align:center}
  .bar{flex:1;height:6px;background:var(--glass-2);border-radius:4px;cursor:pointer;position:relative;overflow:visible}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;width:0%;box-shadow:0 0 8px var(--accent-glow)}
  .bar .thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 6px var(--accent-glow);opacity:0;transition:.18s;left:0%}
  .bar:hover .thumb{opacity:1}
  .bar:hover .fill{box-shadow:0 0 12px var(--accent-glow)}

  .p-right{display:flex;align-items:center;justify-content:flex-end;gap:14px}
  .volume{display:flex;align-items:center;gap:8px;width:130px}
  .volume .bar{flex:1}
  .vol-btn{background:none;border:none;color:var(--text-2);cursor:pointer;display:flex}
  .vol-btn:hover{color:var(--text)}
  .mode-btn{background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;border-radius:50%;display:flex}
  .mode-btn:hover{color:var(--text)}
  .mode-btn.active{color:var(--accent)}

  /* ---------- Lyrics panel ---------- */
  .lyrics-toggle{
    background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;border-radius:50%;display:flex;
  }
  .lyrics-toggle:hover{color:var(--accent)}
  .lyrics-toggle.active{color:var(--accent)}

  .lyrics-panel{
    position:fixed;right:14px;top:14px;bottom:96px;width:340px;
    background:rgba(12,12,14,.9);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(28px) saturate(1.2);
    -webkit-backdrop-filter:blur(28px) saturate(1.2);
    transform:translateX(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:50;display:flex;flex-direction:column;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .lyrics-panel.open{transform:translateX(0)}
  .lyrics-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .lyrics-head h3{font-size:14px;font-weight:600}
  .lyrics-head .close{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:18px;transition:.2s}
  .lyrics-head .close:hover{color:var(--text)}
  .lyrics-body{flex:1;overflow:hidden;position:relative;padding:40% 18px;text-align:center}
  .lyrics-body::before,.lyrics-body::after{content:"";position:absolute;left:0;right:0;height:30%;pointer-events:none;z-index:2}
  .lyrics-body::before{top:0;background:linear-gradient(180deg,rgba(12,12,14,.96),transparent)}
  .lyrics-body::after{bottom:0;background:linear-gradient(0deg,rgba(12,12,14,.96),transparent)}
  .lrc-track{transition:transform .5s cubic-bezier(.4,0,.2,1)}
  .lrc-line{
    padding:9px 0;font-size:13.5px;color:var(--text-3);transition:.3s;
    white-space:pre-wrap;line-height:1.5;cursor:pointer;
  }
  .lrc-line:hover{color:var(--text-2)}
  .lrc-line.active{color:#fff;font-size:19px;font-weight:700;text-shadow:0 0 18px var(--accent-glow)}
  .lrc-empty{color:var(--text-3);font-size:13px;padding-top:30px}

  /* ---------- Favorites / Queue / Playlist wall ---------- */
  .fav-btn{
    background:none;border:none;color:var(--text-3);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:4px;transition:.15s;flex-shrink:0;
  }
  .fav-btn:hover{color:#fb7185;transform:scale(1.15)}
  .fav-btn.on{color:#fb7185}
  .fav-btn.on svg{fill:currentColor}
  .btn-clear{
    display:flex;align-items:center;gap:6px;
    background:none;border:1px solid var(--border);color:var(--text-2);
    font-size:12px;padding:9px 16px;border-radius:30px;cursor:pointer;transition:.2s;
  }
  .btn-clear:hover{color:var(--danger);border-color:var(--danger)}
  .pl-wall{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pl-tile{
    aspect-ratio:1.35;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;color:#fff;font-size:12px;font-weight:600;
    transition:.22s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
    text-shadow:0 1px 4px rgba(0,0,0,.4);

  .queue-panel{

  .q-row.playing .qi{color:var(--accent)}
  .q-row .qt{min-width:0;flex:1}
  .q-row .qt .qn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-row .qt .qa{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .q-row .qx{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px;opacity:0;transition:.15s;flex-shrink:0}

  /* ---------- Play page (vinyl + lyrics + comments) ---------- */
  .playpage{
    position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));
    --glow1:167,139,250;--glow2:124,58,237;
    background:#0b0b0d;border-radius:var(--radius);
    border:1px solid var(--border);
    transform:translateY(calc(100% + 110px));
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    z-index:80;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow);
  }
  .playpage.open{transform:translateY(0)}
  .pp-bg{position:absolute;inset:0;z-index:0}
  .pp-bg img{width:100%;height:100%;object-fit:cover;filter:blur(90px) brightness(.4) saturate(1.3);transform:scale(1.3)}
  .pp-bg::before{
    content:"";position:absolute;inset:-25%;
    background:
      radial-gradient(42% 36% at 22% 28%, rgba(var(--glow1),.32), transparent 70%),
      radial-gradient(48% 42% at 78% 72%, rgba(var(--glow2),.26), transparent 70%);

  }
  @keyframes bgdrift{to{transform:translate(5%,-4%) scale(1.12)}}
  .pp-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.55),rgba(11,11,13,.85))}
  .pp-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
  .pp-collapse{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    background:var(--glass-2);border:none;color:var(--text-2);
    width:36px;height:36px;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.2s;
  }
  .pp-collapse:hover{color:var(--text);background:rgba(255,255,255,.1)}
  .pp-head-info{text-align:center;min-width:0;max-width:70%}
  .pp-head-info .t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pp-head-info .a{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pp-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 24px 22px;min-height:0;overflow:hidden}
  .pp-disc-wrap{position:relative;width:min(280px,62vw,40vh);flex-shrink:0}
  .pp-disc{
    position:relative;width:100%;aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle,#0a0a0c 0 19%,transparent 19%),
      repeating-radial-gradient(circle,#131316 0 1.5px,#1c1c21 1.5px 3.5px),
      #101013;
    box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
    animation:ppspin 26s linear infinite;animation-play-state:paused;
  }
  .playpage.playing .pp-disc{animation-play-state:running}
  @keyframes ppspin{to{transform:rotate(360deg)}}
  .pp-cover{
    width:62%;aspect-ratio:1;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 5px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.5);
  }
  .pp-cover img{width:100%;height:100%;object-fit:cover}
  .pp-spindle{
    position:absolute;left:50%;top:50%;width:12px;height:12px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:#0a0a0c;box-shadow:0 0 0 2px rgba(255,255,255,.12);z-index:3;
  }
  .pp-disc-sheen{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;
    background:linear-gradient(135deg,rgba(255,255,255,.09),transparent 38%,transparent 62%,rgba(255,255,255,.05));
  }
  /* 弥散光晕：跟随歌曲换色 */
  .pp-glow{
    position:absolute;left:50%;top:50%;width:175%;aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;z-index:0;
    background:radial-gradient(closest-side, rgba(var(--glow1),.42), rgba(var(--glow1),.13) 52%, transparent 74%);
    animation:glowpulse 6s ease-in-out infinite;
  }
  @keyframes glowpulse{
    0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}
  }
  /* 唱片 A/B 翻面 */
  .pp-flip{
    position:relative;width:100%;aspect-ratio:1;cursor:pointer;
    transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,0,.2,1);
  }
  .playpage.flipped .pp-flip{transform:rotateY(180deg)}
  .playpage.flipped .pp-arm{opacity:0}
  .pp-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .pp-face.pp-back{transform:rotateY(180deg)}
  .pp-backcard{
    width:92%;height:92%;margin:4%;border-radius:20px;
    background:linear-gradient(160deg,#17171b,#101013);
    border:1px solid var(--border);
    box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;padding:10px 16px;text-align:center;overflow:hidden;

  .pp-backcard .bc-name{font-size:15px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .pp-backcard .bc-artist{font-size:12px;color:var(--text-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .pp-backcard .bc-rows{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
  .pp-backcard .bc-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:11.5px;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.04);
    flex-shrink:0;
  }
  .pp-backcard .bc-row span{color:var(--text-3);flex-shrink:0}
  .pp-backcard .bc-row b{color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pp-backcard .bc-tip{font-size:10px;color:var(--text-3);flex-shrink:0}
  /* 弹幕评论 */
  .pp-danmaku{position:absolute;top:2%;left:0;right:0;height:60%;z-index:7;pointer-events:none;overflow:hidden}
  .pp-danmaku .dm{
    position:absolute;left:100%;white-space:nowrap;max-width:70%;
    padding:5px 14px;border-radius:20px;font-size:12px;color:#e8e8ec;
    background:rgba(18,18,22,.55);border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    text-overflow:ellipsis;overflow:hidden;
    animation:dmfly linear infinite;animation-play-state:paused;
  }
  .playpage.playing .pp-danmaku .dm{animation-play-state:running}
  @keyframes dmfly{to{transform:translateX(calc(-100vw - 100%))}}
  /* 尊重系统「减少动态效果」设置：停用旋转/光晕脉动/背景漂移，弹幕放慢 */
  @media (prefers-reduced-motion:reduce){
    .pp-disc,.pp-glow,.pp-bg::before,.pp-arm{animation:none !important}
    .pp-danmaku .dm{animation-duration:60s !important}
    .pp-flip{transition:none}
  }
  .pp-arm{
    position:absolute;top:-8%;right:-4%;width:130px;height:230px;z-index:6;
    transform-origin:34px 34px;transform:rotate(-32deg);
    transition:transform .6s cubic-bezier(.34,1.2,.4,1),opacity .4s ease;
    pointer-events:none;
  }
  .playpage.playing .pp-arm{transform:rotate(0deg)}
  .pp-arm-base{
    position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#4a4a52,#17171b 75%);
    box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .pp-arm-rod{
    position:absolute;top:16px;left:15px;width:5px;height:150px;border-radius:3px;
    background:linear-gradient(180deg,#3a3a41,#202024);
    transform:rotate(18deg);transform-origin:top center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  }
  .pp-arm-head{
    position:absolute;top:156px;left:52px;width:18px;height:34px;border-radius:5px;
    background:linear-gradient(180deg,#3d3d45,#1b1b20);
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .pp-right{flex:1;min-width:0;width:min(600px,100%);min-height:0;display:flex;flex-direction:column}
  .pp-tabs{display:flex;gap:26px;justify-content:center;padding:2px 6px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
  .pp-tab{
    background:none;border:none;color:var(--text-3);font-size:14px;font-weight:600;
    cursor:pointer;padding:4px 2px;position:relative;transition:.2s;letter-spacing:1px;
  }
  .pp-tab .cnt{font-size:11px;color:var(--text-3);font-weight:400;margin-left:3px}
  .pp-tab:hover{color:var(--text-2)}
  .pp-tab.active{color:var(--text)}
  .pp-tab.active::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-11px;
    width:20px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);
  }
  .pp-pane{flex:1;min-height:0}
  .pp-pane.hidden{display:none}
  .pp-lyrics{
    height:100%;overflow:hidden;position:relative;text-align:center;
    mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
  }
  .pp-lyrics .lrc-track{padding:42px 0}
  .pp-lyrics .lrc-line{font-size:15px;color:rgba(255,255,255,.38);padding:0;line-height:1.6}
  .pp-lyrics .lrc-line.active{
    color:#fff;font-size:17px;font-weight:600;
    text-shadow:0 0 20px rgba(255,255,255,.4);transform:scale(1.05);
  }
  .pp-cmt-scroll{height:100%;overflow-y:auto;padding:6px 8px 30px}
  .pp-cmt-scroll::-webkit-scrollbar{width:6px}
  .pp-cmt-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
  .pp-cmt-sec{font-size:13px;font-weight:700;color:var(--text);padding:16px 4px 4px;letter-spacing:1px}
  .pp-cmt-sec .sec-cnt{font-size:11px;color:var(--text-3);font-weight:400;margin-left:6px}
  .pp-cmt{display:flex;gap:12px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
  .pp-cmt:last-child{border-bottom:none}
  .pp-cmt .ava{
    width:34px;height:34px;border-radius:50%;object-fit:cover;
    background:var(--bg-2);flex-shrink:0;box-shadow:0 0 0 1px var(--border);
  }
  .pp-cmt .cbody{flex:1;min-width:0}
  .pp-cmt .nm{font-size:12px;color:var(--text-3)}
  .pp-cmt .ct{font-size:13.5px;color:var(--text);line-height:1.7;margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .pp-cmt .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--text-3)}
  .pp-cmt .like{display:inline-flex;align-items:center;gap:4px}

  /* ---------- 移动端顶栏（桌面隐藏；必须位于 responsive 段之前） ---------- */
  .m-top{
    display:none;position:fixed;top:0;left:0;right:0;z-index:52;
    height:calc(50px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 8px 0;
    align-items:center;justify-content:space-between;
    background:rgba(9,9,11,.88);border-bottom:1px solid var(--border);
    backdrop-filter:blur(24px) saturate(1.3);
    -webkit-backdrop-filter:blur(24px) saturate(1.3);
  }
  .m-brand{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;letter-spacing:.5px}
  .m-logo{
    width:26px;height:26px;border-radius:8px;font-size:14px;color:#0a0a0b;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px var(--accent-glow);
  }
  .m-btn{
    width:40px;height:40px;border:none;background:none;color:var(--text-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;border-radius:10px;
  }
  .m-btn:active{background:var(--glass-2);color:var(--text)}
  .m-mask{display:none}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .app{grid-template-columns:1fr;gap:0;padding:0}
    .main{grid-column:1;border-radius:0;border-left:none;border-right:none;margin-top:calc(50px + env(safe-area-inset-top,0px))}

    /* 顶栏显示 + 遮罩可用 */
    .m-top{display:flex}
    .m-mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .m-mask.show{opacity:1;pointer-events:auto}

    /* 侧边栏 → 左滑抽屉 */
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:min(80vw,330px);z-index:62;
      border-radius:0;border-top:none;border-bottom:none;
      padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
      transform:translateX(-105%);transition:transform .34s cubic-bezier(.4,0,.2,1);
      box-shadow:30px 0 60px rgba(0,0,0,.55);
    }
    .sidebar.open{transform:translateX(0)}

    /* 榜单头部紧凑化 */
    .chart-header{padding:14px 16px 10px;gap:13px;align-items:center}
    .chart-cover{width:64px;height:64px;border-radius:13px;font-size:26px}
    .chart-meta .tag{display:none}
    .chart-meta h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
    .chart-meta p{display:none}
    .btn-play-all{padding:8px 14px;font-size:12px}
    .btn-clear{font-size:11px;padding:6px 10px}

    /* 播放栏：紧凑 + iPhone 底部安全区 */
    .player{grid-template-columns:1fr auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:12px}
    .p-center{display:none}
    .volume{display:none}
    .vinyl{width:46px;height:46px}
    .vinyl img{inset:11px}
    .p-right{gap:6px}
    .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));font-size:12px;max-width:82vw}

    /* 队列抽屉全宽 + 底部安全区 */
    .queue-panel{right:0;left:0;top:auto;bottom:0;width:100%;max-height:72vh;height:auto;
      border-radius:16px 16px 0 0;border-bottom:none;transform:translateY(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);
      padding-bottom:env(safe-area-inset-bottom,0px)}
    .queue-panel.open{transform:translateY(0)}

    /* 播放页适配 */
    .pp-disc-wrap{width:min(58vw,230px)}
    .pp-arm{scale:.72}
    .pp-body{padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:10px}
    .pp-sheet{border-radius:0}

    /* 歌曲行触屏优化：取消 hover 残留，加大触摸目标 */
    .song-row{-webkit-tap-highlight-color:transparent}
    .song-row .idx{width:26px}
  }
  /* 触屏设备：禁用 hover 卡片浮起等需要鼠标的效果 */
  @media (hover:none){
    .song-row:hover{transform:none;border-color:transparent}
    .pl-tile:hover{transform:none}
    .chart-item:hover{background:none;color:var(--text-2)}
    .chart-item.active:hover{background:linear-gradient(90deg,rgba(167,139,250,.18),rgba(167,139,250,.03));color:var(--text)}
  }
  /* iOS：输入框字号<16px 聚焦时会强制放大页面，触屏下一律 16px */
  @media (pointer:coarse){
    .search input{font-size:16px}
  }
  .toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(18,18,20,.9);color:#fff;padding:10px 20px;border-radius:30px;
    font-size:13px;opacity:0;transition:.3s cubic-bezier(.4,0,.2,1);z-index:100;pointer-events:none;
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Folia(Lattice) 海报墙：直角海报+颗粒+暗角+双色辉光 ---------- */
  .list-stage{position:relative;min-height:0;display:flex;flex-direction:column}
  .list-stage .song-list{flex:1}
  .stage-particles{
    position:absolute;inset:0;width:100%;height:100%;z-index:0;
    pointer-events:none;opacity:0;transition:opacity .7s ease;
  }
  body.folia .stage-particles{opacity:1!important;transition:none}
  /* 墙面：双色径向辉光（accent 左上 + secondary 右下，源码 wall.css .lattice-root） */
  body.folia .list-stage{
    background:
      radial-gradient(circle at 14% 12%, rgba(253,92,71,.15), transparent 29%),
      radial-gradient(circle at 86% 82%, rgba(106,72,255,.20), transparent 32%),
      #070707;
  }
  /* 颗粒噪点（feTurbulence soft-light，源码 .lattice-root::after） */
  body.folia .list-stage::before{
    content:"";position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.13;
    mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  }
  /* 浅暗角（源码 .has-vignette::before） */
  body.folia .list-stage::after{
    content:"";position:absolute;inset:0;z-index:29;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 78%, rgba(0,0,0,.45) 100%);
  }
  .pp-particles{
    position:absolute;inset:0;width:100%;height:100%;z-index:1;
    pointer-events:none;opacity:.9;mix-blend-mode:screen;
  }
  .song-list.folia{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
    gap:16px;padding:18px 20px 32px;align-content:start;
  }
  /* 海报卡：直角、无玻璃、3:4 竖幅，源码 .lattice-poster */
  .song-list.folia .song-row{
    position:relative;display:block;min-width:0;padding:0;margin:0;
    border-radius:0;border:0;overflow:hidden;aspect-ratio:3/4;
    background-color:#161419;cursor:pointer;
    outline:1px solid rgba(255,255,255,.05);outline-offset:-1px;
    transition:outline-color .3s ease,filter .6s ease;
    content-visibility:auto;contain-intrinsic-size:auto 240px;
  }
  /* 首卡跨两列横幅（拼贴感） */
  .song-list.folia .song-row:first-child{grid-column:span 2;aspect-ratio:16/10}
  /* 海报底部压暗渐变（源码 .lattice-poster-shade） */
  .song-list.folia .song-row::before{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.05) 34%, rgba(0,0,0,.24) 56%, rgba(0,0,0,.92) 100%);
  }
  /* 背景卡安静 tint，悬停/播放中揭开（源码 .lattice-poster-tint） */
  .song-list.folia .song-row::after{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5;
    background:linear-gradient(145deg, rgba(7,7,7,.80), rgba(7,7,7,.86));
    transition:opacity .26s ease;
  }
  .song-list.folia .song-row:hover::after,
  .song-list.folia .song-row.playing::after{opacity:0}
  /* 悬停：提亮提饱和 + 抬升投影（源码 .lattice-poster:hover / elevation） */
  .song-list.folia .song-row:hover{filter:saturate(1.08) brightness(1.06);z-index:3;outline-color:rgba(255,255,255,.14)}
  /* 播放中：accent 2px 内描边 + 内发光（源码 .is-current::before） */
  .song-list.folia .song-row.playing{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
  .song-list.folia .song-row.playing .thumb::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.52), inset 0 0 22px -6px color-mix(in srgb,var(--accent) 52%,transparent);
    animation:ppGlowPulse 2.4s ease-in-out infinite;
  }
  /* 序号徽章：直角、11px/800/tabular（源码 .lattice-poster-badge） */
  .song-list.folia .song-row .idx{
    position:absolute;top:14px;left:14px;z-index:4;display:inline-flex;align-items:center;gap:2px;
    width:auto;min-width:0;height:auto;padding:5px 8px;margin:0;
    border-radius:0;border:0;background:rgba(0,0,0,.62);
    backdrop-filter:none;-webkit-backdrop-filter:none;
    font-size:11px;font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;
    color:#f7f4ee;
  }
  .song-list.folia .song-row .idx .num{color:inherit}
  .song-list.folia .song-row .idx .play-mini{display:none}
  .song-list.folia .song-row.playing .idx{background:rgba(0,0,0,.78);color:var(--accent)}
  /* 封面铺满整卡 */
  .song-list.folia .song-row .song-info{display:contents;margin:0}
  .song-list.folia .song-row .thumb{
    position:absolute;inset:0;width:100%;height:100%;padding-bottom:0;
    border-radius:0;overflow:hidden;background:#101013;margin:0;
  }
  .song-list.folia .song-row .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
  .song-list.folia .song-row:hover .thumb img{transform:scale(1.045)}
  /* 文案：右下角超大紧排标题（源码 .lattice-poster-copy strong） */
  .song-list.folia .song-row .meta{
    position:absolute;left:17px;right:17px;bottom:15px;z-index:4;
    display:flex;flex-direction:column;gap:5px;margin:0;min-width:0;max-width:100%;
  }
  .song-list.folia .song-row .title{
    font-size:clamp(20px,1.8vw,32px);line-height:.96;letter-spacing:-.045em;font-weight:700;

  }
  .song-list.folia .song-row .artist{

  .song-list.folia .song-row .more{

<script>
const API = "https://api.injahow.cn/meting/";
const GD = "https://music-api.gdstudio.xyz/api.php";

/* ---------- Data layer: GD Studio 优先 + injahow 兜底 ---------- */
function mapGdTrack(t){
  return {
    id:String(t.id),
    name:t.name||"未知歌曲",
    artist:(t.ar||[]).map(a=>a.name).join(" / ")||"未知歌手",
    pic:((t.al&&t.al.picUrl)||"").replace(/^http:/,"https:"),
    album:(t.al&&t.al.name)||"",
    dur:t.dt||0,
    url:"", lrc:""
  };
}
async function fetchPlaylist(pid){
  // GD Studio（主源）
  try{
    const res = await fetch(`${GD}?types=playlist&source=netease&id=${pid}`);
    const j = await res.json();
    const tr = j && j.playlist && j.playlist.tracks;
    if(Array.isArray(tr) && tr.length){
      return tr.map(mapGdTrack);
    }
  }catch(e){}
  // injahow Meting（兜底）
  try{
    const res = await fetch(`${API}?type=playlist&id=${pid}&server=netease`);
    const list = await res.json();
    if(Array.isArray(list) && list.length && list[0] && list[0].name){
      return list.map(s=>({
        id:String(s.id||""),
        name:s.name||"未知歌曲",
        artist:s.artist||"未知歌手",
        pic:(s.pic||"").replace(/^http:/,"https:"),
        url:s.id?`${API}?type=url&id=${s.id}&server=netease`:"",
        lrc:s.id?`${API}?type=lrc&id=${s.id}&server=netease`:""
      }));
    }
  }catch(e){}
  return null;
}
// 每次播放都现取新链接（网易直链约20分钟过期）；音质跟随用户设置（yy_br，默认320K）
async function ensurePlayUrl(s){
  if(s.url) return s.url; // 兜底源返回的链接
  const br = store.get('yy_br',"320") || "320";
  try{
    const res = await fetch(`${GD}?types=url&source=netease&id=${s.id}&br=${br}`);
    const j = await res.json();
    if(j && j.url) return j.url;
    if(br==="999"){ // 无损不可用时降级 320K 重试一次
      const r2 = await fetch(`${GD}?types=url&source=netease&id=${s.id}&br=320`);
      const j2 = await r2.json();
      if(j2 && j2.url) return j2.url;
    }
  }catch(e){}

/* ---------- Load chart playlist ---------- */
async function loadChart(idx){
  currentChart = idx;
  listMode = null; fmMode = false;
  currentIdx = -1;
  setActiveNav("chart", idx);
  clearBtn.style.display = "none";
  const c = CHARTS[idx];
  chartTitle.textContent = c.name;
  chartDesc.textContent = c.desc;
  chartTag.textContent = "REAL-TIME";
  chartCover.innerHTML = c.icon;
  chartCover.style.background = "linear-gradient(135deg,#27272a,#18181b)";

  // 榜单本地缓存：命中立即渲染（首开速度 = 0 网络），过期/缺失才走网络
  const ck = "yy_chartcache_"+idx;
  let cached = null;
  try{ cached = JSON.parse(store.get(ck,"null")||"null"); }catch(e){}
  const fresh = cached && Array.isArray(cached.list) && cached.list.length && (Date.now()-cached.t < 10*60*1000);

  if(fresh){
    songs = cached.list;
    renderSongs();
    tryRestore();
  }else{
    songListEl.innerHTML = `<div class="loader"><div class="spinner"></div><p>加载 ${c.name} 中...</p></div>`;
  }

  try{
    const list = await fetchPlaylist(c.id);
    if(!list || !list.length) throw new Error("empty");
    store.set(ck, JSON.stringify({t:Date.now(), list}));
    // 用户还停留在该榜单时才刷新界面（缓存路径下避免重放恢复逻辑）
    if(currentChart===idx){
      songs = list;
      renderSongs();
      if(!fresh) tryRestore();
    }
  }catch(e){
    // 有旧缓存兜底就不报错；仅完全无数据时提示
    if(!fresh){
      songListEl.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><p>加载失败，请稍后重试</p></div>`;
      toast("网络加载失败");
    }
  }
}

/* ---------- Playback ---------- */
async function playSong(idx){
  if(idx<0||idx>=songs.length) return;
  currentIdx = idx;
  const s = songs[idx];
  pTitle.textContent = s.name;
  pArtist.textContent = s.artist;
  pCover.src = s.pic || "";
  updatePlayPage(s);
  // 记录历史 / 保存状态 / 更新收藏心 / 系统媒体信息 / 标签页标题
  recordHistory(s);
  saveState(s, 0);
  updatePFav();
  setMediaSession(s);
  document.title = `▶ ${s.name} - ${s.artist} | 云音播放器`;
  if(currentQueueOpen) renderQueue();
  // update row highlight
  document.querySelectorAll(".song-row").forEach((e,i)=>e.classList.toggle("playing",i===idx));
  // load lyrics
  loadLyrics(s);
  // scroll into view
  const row = songListEl.querySelector(`.song-row[data-idx="${idx}"]`);
  if(row) row.scrollIntoView({behavior:"smooth",block:"nearest"});
  // 获取播放链接并播放（GD Studio 现取，网易直链会过期）
  const url = await ensurePlayUrl(s);
  if(currentIdx!==idx) return; // 等待期间用户已切歌
  audio.src = url;
  audio.play().then(()=>{
    setPlaying(true);
    listFx.recolor(); ppFx.recolor(); // Folia 粒子随歌曲色板换色
    preloadNext(idx); // 汽水式无缝切歌：提前取好下一首的播放链接
  }).catch(err=>{
    if(restoring){
      restoring = false;
      toast("点击播放键继续收听上次歌曲");
      return;
    }
    toast("播放失败，自动切换下一首");
    setTimeout(()=>nextSong(),800);
  });
}

// 预加载下一首播放链接：切歌零等待（链接约20分钟有效，预载后立即用没问题）
function preloadNext(idx){
  const nx = songs[(idx+1) % songs.length];

  ensurePlayUrl(nx).then(u=>{ if(nx===songs[(currentIdx+1)%songs.length]) nx.url = u; }).catch(()=>{});
}

/* ---------- Progress ---------- */
audio.addEventListener("timeupdate",()=>{
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  const pct = dur ? (cur/dur*100) : 0;
  progressFill.style.width = pct+"%";
  progressThumb.style.left = pct+"%";
  curTimeEl.textContent = fmt(cur);
  durTimeEl.textContent = fmt(dur);
  updateLyrics(cur);
  // 记忆播放进度（每3秒保存一次）
  if(cur - lastSaveTime > 3){
    lastSaveTime = cur;
    if(currentIdx>=0 && songs[currentIdx]) saveState(songs[currentIdx], cur);
  }
  // 同步系统媒体面板进度
  try{
    if('mediaSession' in navigator && isFinite(dur) && dur>0){
      navigator.mediaSession.setPositionState({duration:dur, playbackRate:audio.playbackRate, position:Math.min(cur,dur)});
    }
  }catch(e){}
});
audio.addEventListener("loadedmetadata",()=>{
  durTimeEl.textContent = fmt(audio.duration);
  // 恢复上次播放进度
  if(pendingSeek != null && isFinite(audio.duration) && audio.duration > 0){
    try{ audio.currentTime = Math.min(pendingSeek, Math.max(0, audio.duration - 1)); }catch(e){}
    pendingSeek = null;
  }
});
audio.addEventListener("play",()=>{
  setPlaying(true);
  syncPlayPageState();
  try{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing"; }catch(e){}
  const s = songs[currentIdx];
  if(s) document.title = `▶ ${s.name} - ${s.artist} | 云音播放器`;
});
audio.addEventListener("pause",()=>{
  setPlaying(false);
  syncPlayPageState();
  try{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused"; }catch(e){}
  document.title = BASE_TITLE;
});

function fmt(s){
  if(!isFinite(s)) return "00:00";
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown",(e)=>{
  const t = e.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.code==="Space"){e.preventDefault();togglePlay();}
  else if(e.code==="ArrowRight"){audio.currentTime = Math.min(audio.duration,audio.currentTime+5);}
  else if(e.code==="ArrowLeft"){audio.currentTime = Math.max(0,audio.currentTime-5);}
  else if(e.code==="ArrowUp"){e.preventDefault();applyVolume(Math.min(1,audio.volume+0.05));}
  else if(e.code==="ArrowDown"){e.preventDefault();applyVolume(Math.max(0,audio.volume-0.05));}
  else if(e.code==="KeyM"){audio.muted=!audio.muted;toast(audio.muted?"已静音":"已取消静音");}
  else if(e.code==="Escape"){
    if(playPage.classList.contains("open")){ playPage.classList.remove("open"); }
    else if(currentQueueOpen){ currentQueueOpen=false; queuePanel.classList.remove("open"); }
    else if(lyricsPanel.classList.contains("open")){ lyricsPanel.classList.remove("open"); lrcToggle.classList.remove("active"); }
  }
});

/* ---------- Lyrics ---------- */
function setLrcHtml(html){
  lrcTrack.innerHTML = html;
  ppLrcTrack.innerHTML = html;
}
async function loadLyrics(song){
  lyrics = [];
  setLrcHtml('<div class="lrc-empty">加载歌词中...</div>');
  if(!song || !song.id){ setLrcHtml('<div class="lrc-empty">暂无歌词</div>'); return; }
  let text = null;
  // GD Studio 优先
  try{
    const res = await fetch(`${GD}?types=lyric&source=netease&id=${song.id}`);
    const j = await res.json();
    if(j && j.lyric) text = j.lyric;
  }catch(e){}
  // injahow 兜底
  if(!text){
    try{
      const res2 = await fetch(`${API}?type=lrc&id=${song.id}&server=netease`);
      const t2 = await res2.text();
      if(t2 && t2.trim().startsWith("[")) text = t2;
    }catch(e){}
  }
  if(text && text.trim()){
    parseLrc(text);
  }else{
    setLrcHtml('<div class="lrc-empty">纯音乐 · 暂无歌词</div>');
  }
}
function parseLrc(text){
  const lines = text.split(/\r?\n/);
  const re = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
  const arr = [];
  for(const line of lines){
    const matches = [...line.matchAll(re)];
    const content = line.replace(re,"").trim();
    if(!matches.length) continue;
    for(const m of matches){
      const t = (+m[1])*60 + (+m[2]);
      if(content) arr.push({t,content});
    }
  }
  arr.sort((a,b)=>a.t-b.t);
  lyrics = arr;
  if(!arr.length){ setLrcHtml('<div class="lrc-empty">暂无歌词</div>'); return; }
  const html = arr.map(l=>`<div class="lrc-line">${l.content}</div>`).join("");
  setLrcHtml(html);
  lastLrcIdx = -1;
  updateLyrics(audio.currentTime);
}
function updateLyrics(cur){
  if(!lyrics.length) return;
  let idx = -1;
  for(let i=0;i<lyrics.length;i++){
    if(lyrics[i].t <= cur) idx = i; else break;
  }
  if(idx===lastLrcIdx) return;
  lastLrcIdx = idx;
  syncLrcTrack(lrcTrack, idx);
  syncLrcTrack(ppLrcTrack, idx);
}
function syncLrcTrack(track, idx){
  const lines = track.querySelectorAll(".lrc-line");
  lines.forEach((l,i)=>l.classList.toggle("active",i===idx));
  if(idx>=0 && lines[idx]){
    const vp = track.parentElement;
    const offset = lines[idx].offsetTop - vp.clientHeight/2 + lines[idx].clientHeight/2;
    track.style.transform = `translateY(${-offset}px)`;
  }
}
// 歌词点击跳转进度（侧边面板 + 播放页）
function bindLrcClick(track){
  track.addEventListener("click",(e)=>{
    const line = e.target.closest(".lrc-line");
    if(!line) return;
    const idx = Array.from(track.children).indexOf(line);
    if(idx>=0 && lyrics[idx] && isFinite(lyrics[idx].t) && lyrics[idx].t > 0){
      audio.currentTime = lyrics[idx].t;
      if(audio.paused) audio.play();
    }
  });
}

  try{
    const res = await fetch(`${GD}?types=search&source=netease&name=${encodeURIComponent(kw)}&count=30`);
    const arr = await res.json();
    if(Array.isArray(arr) && arr.length){
      results = arr.map(t=>({
        id:String(t.id),
        name:t.name||"未知歌曲",
        artist:(t.artist||[]).join(" / ")||"未知歌手",
        pic:"",
        url:"",
        lrc:""
      }));
    }
  }catch(e){}
  // CORS 代理直连网易（兜底）
  if(!results.length){
    const proxies = [
      (u)=>`https://cors.eu.org/${u}`,
      (u)=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      (u)=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
    ];
    const target = `https://music.163.com/api/search/get?s=${encodeURIComponent(kw)}&type=1&limit=40`;
    for(const proxy of proxies){
      try{
        const res = await fetch(proxy(target), {cache:"no-store"});
        if(!res.ok) continue;
        const data = await res.json();
        if(data && data.result && Array.isArray(data.result.songs)){
          results = data.result.songs.map(s=>({
            id:String(s.id),
            name:s.name,
            artist:(s.artists||[]).map(a=>a.name).join(" / "),
            pic:s.album && s.album.picUrl ? (s.album.picUrl + "?param=200y200").replace(/^http:/,"https:") : "",
            album:(s.album&&s.album.name)||"",
            dur:s.duration||0,
            url:"",
            lrc:""
          }));
          break;
        }
      }catch(e){}
    }
  }
  if(results.length){
    songs = results;
    renderSongs();
    chartDesc.textContent = `找到 ${results.length} 首与"${kw}"相关的歌曲`;
  }else{
    songs = [];
    songListEl.innerHTML = `<div class="empty"><p>未找到"${kw}"相关歌曲，或搜索服务暂不可用</p></div>`;
    chartDesc.textContent = `未找到相关结果`;
  }
}

// 弥散光晕色板（按歌曲 hash 取色，避免跨域取色失败）
const GLOWS = [
  ["167,139,250","124,58,237"],  // 紫罗兰
  ["96,165,250","37,99,235"],    // 天蓝
  ["45,212,191","13,148,136"],   // 青绿

];
function hashSong(id){ let h=0; for(const ch of String(id)) h=(h*31+ch.charCodeAt(0))>>>0; return h; }

/* ---------- Diorama 粒子引擎（Folia 风格：云团聚类+双层辉光+节拍脉动+溶解转场） ---------- */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function makeParticles(canvas){
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, raf = null, active = false, mx = .5, my = .5;
  let parts = [], clusters = [], pal = [[253,92,71],[106,72,255]];
  let bpm = 112, beatPhase = 0, lastBeatIdx = -1, kick = 0, kx = 0, ky = 0;
  let mode = "in", modeT = 0, pendingRebuild = false; // in: 淡入成形 / out: 溶解飞散
  function setPalette(){
    const s = songs[currentIdx];
    if(s){
      pal = GLOWS[hashSong(s.id)%GLOWS.length].map(c=>c.split(",").map(Number));
      const h = hashSong(s.id);
      bpm = 92 + h%46;               // 每首歌一个稳定"心跳"
      beatPhase = (h%97)/97*6.28;
    }
  }
  function sprite(col){
    const s = document.createElement("canvas"); s.width = s.height = 64;
    const g = s.getContext("2d");
    const grd = g.createRadialGradient(32,32,2,32,32,30);
    grd.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},.9)`);
    grd.addColorStop(.35, `rgba(${col[0]},${col[1]},${col[2]},.30)`);
    grd.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    g.fillStyle = grd; g.fillRect(0,0,64,64);
    return s;
  }
  function build(){
    // 云团聚类（源码 clouds 模式）：3-6 个簇锚点，粒子高斯散布在簇周围
    clusters = [];
    const n = Math.max(3, Math.min(6, Math.round(W*H/240000)+2));
    for(let i=0;i<n;i++){
      clusters.push({
        x:(0.12+Math.random()*.76)*W, y:(0.12+Math.random()*.76)*H,
        r:Math.min(W,H)*(.10+Math.random()*.15),
        ph:Math.random()*6.28, bx:(Math.random()-.5)*16, by:(Math.random()-.5)*12,
      });
    }
    parts = [];
    const total = Math.max(26, Math.min(64, Math.round(W*H/14000)));
    for(let i=0;i<total;i++){
      const c = clusters[i%clusters.length];
      const a = Math.random()*6.283, d = c.r*Math.sqrt(Math.random());
      const t = Math.random();
      const col = pal[0].map((v,k)=>Math.round(v+(pal[1][k]-v)*t));
      parts.push({
        hx:c.x+Math.cos(a)*d, hy:c.y+Math.sin(a)*d, x:0, y:0,
        r:.9+Math.random()*2.4, al:.42+Math.random()*.5,
        ph:Math.random()*6.28, sw:.2+Math.random()*.5,
        c, cl:c, sp:sprite(col), dx:0, dy:0,
      });
    }
  }
  function frame(now){
    if(!active){ raf = null; return; }
    raf = requestAnimationFrame(frame);
    if(document.hidden) return;
    const dt = Math.min(.05, (now-(frame.__t||now))/1000); frame.__t = now;
    // 节拍时钟：到拍踢一脚，粒子群外扩回弹（源码 ripple/beat 的 2D 神似）
    const beat = (now/1000)*(bpm/60) + beatPhase;
    const bi = Math.floor(beat);
    if(bi !== lastBeatIdx){
      lastBeatIdx = bi;
      kick = bi%4===0 ? 1 : .45; // 每小节头一拍更重
      const c = clusters[bi%Math.max(1,clusters.length)];
      if(c){ kx=c.x; ky=c.y; }
    }
    kick *= Math.exp(-dt*2.8);
    // 溶解/成形转场状态机
    if(mode==="out"){
      modeT += dt;
      if(modeT>=.42){ setPalette(); build(); mode="in"; modeT=0; }
    }else if(mode==="in"){
      modeT = Math.min(1, modeT+dt/.7);
    }
    const fOut = mode==="out" ? Math.min(1, modeT/.42) : 0;
    const fIn  = mode==="in"  ? modeT : 1;
    // 绘制
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    const breath = .24 + .13*Math.sin(now/1000*.5 + beatPhase);
    const swell = breath + kick*.7; // 整体膨胀系数
    for(const p of parts){
      const sway = Math.sin(now*.00045*p.sw + p.ph);
      const cx = p.cl.x + Math.sin(now*.0002 + p.cl.ph)*p.cl.bx;
      const cy = p.cl.y + Math.cos(now*.00016 + p.cl.ph)*p.cl.by;
      // 节拍波纹：从拍点向外的高斯波包
      const kd = Math.hypot(p.hx-kx, p.hy-ky);
      const wave = kick * 34 * Math.exp(-kd/170) * Math.sin(kd*.045 - now*.006);
      // 膨胀：沿簇心向外推
      const ddx = p.hx-cx, ddy = p.hy-cy, dl = Math.hypot(ddx,ddy)||1;
      const push = swell * 26 * (p.r/3);
      let px = cx + ddx/dl*(dl+push) + sway*13 + (mx-.5)*22*p.r + wave*ddx/dl;
      let py = cy + ddy/dl*(dl+push) + Math.cos(now*.00038*p.sw + p.ph*1.7)*10 + (my-.5)*14*p.r + wave*ddy/dl;
      // 溶解：沿"簇心→粒子"方向加速飞散 + 淡出
      let a = p.al * (.55+.45*Math.sin(p.ph + now*.0012)) * fIn;
      if(fOut>0){
        px += (ddx/dl)*fOut*130; py += (ddy/dl)*fOut*130;
        a *= (1-fOut);
      }
      if(a<=0.01) continue;
      const R = p.r * (1 + kick*.5);
      // 双层：大辉光晕 + 小亮核（源码 glow pass + contrast points）
      ctx.globalAlpha = a*.5;
      ctx.drawImage(p.sp, px-R*5, py-R*5, R*10, R*10);
      ctx.globalAlpha = Math.min(1, a*1.15);
      ctx.fillStyle = `rgb(${p.c[0]},${p.c[1]},${p.c[2]})`;
      ctx.beginPath(); ctx.arc(px, py, R*.55, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.max(1, W*dpr); canvas.height = Math.max(1, H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    setPalette(); build();
    if(reducedMotion){ /* 静态一帧 */ active=true; frame(performance.now()); active=false; }
  }
  function start(){
    if(reducedMotion) return;
    if(active) return;
    active = true;
    frame.__t = 0;
    if(!raf) raf = requestAnimationFrame(frame);
  }
  function stop(){ active = false; }
  function dissolve(){ // 换歌：溶解飞散 → 新色板重组
    if(reducedMotion || mode==="out" || !parts.length) return;
    mode = "out"; modeT = 0;
  }
  canvas.parentElement.addEventListener("pointermove",(e)=>{
    const rc = canvas.getBoundingClientRect();
    mx = (e.clientX-rc.left)/Math.max(1,rc.width);
    my = (e.clientY-rc.top)/Math.max(1,rc.height);
  });
  window.addEventListener("resize", ()=>{ clearTimeout(canvas.__rz); canvas.__rz = setTimeout(resize,200); });
  resize();
  return {start, stop, resize, recolor:dissolve};
}

// 评论多通道：直连（浏览器装CORS扩展时可用）+ 多个公共代理，逐个尝试，8秒超时快速失败
const CMT_PROXIES = [
  {u:(t)=>t, p:(d)=>d},
  {u:(t)=>`https://api.allorigins.win/raw?url=${encodeURIComponent(t)}`, p:(d)=>d},
  {u:(t)=>`https://cors.eu.org/${t}`, p:(d)=>d},
  {u:(t)=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(t)}`, p:(d)=>d},
  {u:(t)=>`https://api.allorigins.win/get?url=${encodeURIComponent(t)}`, p:(d)=>JSON.parse((typeof d==="string"?JSON.parse(d):d).contents)},
  {u:(t)=>`https://api.cors.lol/?url=${encodeURIComponent(t)}`, p:(d)=>d},
  {u:(t)=>`https://test.cors.workers.dev/?${t}`, p:(d)=>d},
];
async function fetchTimeout(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms||8000);
  try{ return await fetch(url,{cache:"no-store",signal:ctl.signal}); }
  finally{ clearTimeout(timer); }
}

const discWrap = document.querySelector(".pp-disc-wrap");
let lpTimer = null, lpActive = false;
function startLongPress(){
  if(playPage.classList.contains("flipped")) return; // 背面信息卡不触发
  lpTimer = setTimeout(()=>{
    lpActive = true;
    audio.playbackRate = 2;

  }, 420);
}
function endLongPress(){
  clearTimeout(lpTimer);
  if(lpActive){ lpActive = false; audio.playbackRate = 1; }
}
if(discWrap){
  // 触屏
  discWrap.addEventListener("touchstart",startLongPress,{passive:true});
  discWrap.addEventListener("touchend",endLongPress);
  discWrap.addEventListener("touchcancel",endLongPress);
  discWrap.addEventListener("touchmove",()=>clearTimeout(lpTimer),{passive:true});
  // 鼠标（桌面长按同理）
  discWrap.addEventListener("mousedown",startLongPress);
  discWrap.addEventListener("mouseup",endLongPress);
  discWrap.addEventListener("mouseleave",endLongPress);
  // 上下滑切歌（唱片区）：上滑下一首、下滑上一首，桌面滚轮同样生效
  let sy = 0, sx = 0;
  discWrap.addEventListener("touchstart",(e)=>{ const t=e.touches[0]; sy=t.clientY; sx=t.clientX; },{passive:true});
  discWrap.addEventListener("touchend",(e)=>{
    const t = e.changedTouches[0];
    const dy = t.clientY - sy, dx = t.clientX - sx;
    if(Math.abs(dy)>55 && Math.abs(dx)<60){
      if(lpActive) endLongPress();
      dy<0 ? nextSong() : prevSong();
    }
  },{passive:true});
  let wheelLock = 0;
  discWrap.addEventListener("wheel",(e)=>{
    const now = Date.now();
    if(now - wheelLock < 700) return;
    if(Math.abs(e.deltaY)<20) return;
    wheelLock = now;
    e.deltaY>0 ? nextSong() : prevSong();
  },{passive:true});
}

/* ---------- Comments (NetEase) ---------- */
function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function cmtLike(n){
  n = +n || 0;
  if(n>=100000) return (n/10000).toFixed(0)+"w";
  if(n>=10000) return (n/10000).toFixed(1)+"w";
  return String(n);
}
function cmtTime(t){
  const d = new Date(t);
  const diff = Date.now() - t;
  if(diff < 60e3) return "刚刚";
  if(diff < 3600e3) return Math.floor(diff/60e3)+"分钟前";
  if(diff < 86400e3) return Math.floor(diff/3600e3)+"小时前";
  const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function cmtItem(c){
  const u = c.user || {};
  const ava = (u.avatarUrl||"").replace(/^http:/,"https:");
  return `<div class="pp-cmt">
    <img class="ava" src="${ava}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>
    <div class="cbody">
      <div class="nm">${escHtml(u.nickname||"网易用户")}</div>
      <div class="ct">${escHtml(c.content)}</div>
      <div class="ft">
        <span>${cmtTime(c.time||Date.now())}</span>
        <span class="like">👍 ${cmtLike(c.likedCount)}</span>
      </div>
    </div>
  </div>`;
}
function buildCmtHtml(payload){
  let html = "";
  if(payload.hot.length) html += `<div class="pp-cmt-sec">精彩评论</div>` + payload.hot.slice(0,10).map(cmtItem).join("");
  if(payload.list.length) html += `<div class="pp-cmt-sec">最新评论<span class="sec-cnt">共${cmtLike(payload.total)}条</span></div>` + payload.list.slice(0,20).map(cmtItem).join("");
  return html || '<div class="lrc-empty">还没有评论，快来抢沙发</div>';
}
async function loadComments(song){
  if(!song || !song.id){
    ppCmtList.innerHTML = '<div class="lrc-empty">暂无评论</div>';
    return;
  }
  // 同一首歌且已渲染过，直接返回
  if(cmtSongId === song.id && ppCmtList.dataset.done==="1") return;
  const render = (payload)=>{
    cmtCache.set(song.id, payload);
    if(cmtSongId !== song.id) return; // 响应回来时已切歌：只入缓存，不覆盖界面
    ppCmtList.innerHTML = buildCmtHtml(payload);
    ppCmtCount.textContent = payload.total ? cmtLike(payload.total) : "";
    ppCmtList.dataset.done = "1";
    cmtSongId = song.id;
    if(pbCmt) pbCmt.textContent = cmtLike(payload.total||0)+" 条";
    buildDanmaku(song.id, payload.hot);
  };
  if(cmtCache.has(song.id)){ render(cmtCache.get(song.id)); return; }
  cmtSongId = song.id;
  ppCmtList.dataset.done = "0";
  ppCmtList.innerHTML = '<div class="lrc-empty">评论加载中...</div>';
  const target = `https://music.163.com/api/v1/resource/comments/R_SO_4_${song.id}?limit=30`;
  // 并行竞速：所有通道同时发起，取最先成功的一个（单通道超时8秒，总等待≤8秒）
  const tryProxy = async (px)=>{
    const res = await fetchTimeout(px.u(target), 8000);
    if(!res.ok) throw new Error("http "+res.status);
    const raw = await res.json();
    const data = px.p ? px.p(raw) : raw;
    const hot = data && Array.isArray(data.hotComments) ? data.hotComments : [];
    const list = data && Array.isArray(data.comments) ? data.comments : [];
    if(!hot.length && !list.length) throw new Error("empty");
    return {hot,list,total: (data && typeof data.total==="number") ? data.total : (hot.length+list.length)};
  };
  try{
    const payload = await Promise.any(CMT_PROXIES.map(tryProxy));
    cmtAutoRetries = 0;
    render(payload);
    return;
  }catch(e){}
  if(cmtSongId===song.id && ppCmtList.dataset.done!=="1"){
    ppCmtList.innerHTML = '<div class="lrc-empty" id="ppCmtRetry" style="cursor:pointer;text-decoration:underline dotted">评论加载失败，点击重试</div>';
    const btn = document.getElementById("ppCmtRetry");
    if(btn) btn.addEventListener("click",()=>loadComments(song));
    if(pbCmt) pbCmt.textContent = "暂不可用";
    // 播放页打开时自动重试（最多3次），代理恢复后评论自动出现
    if(playPage.classList.contains("open") && cmtAutoRetries < 3){
      cmtAutoRetries++;
      setTimeout(()=>{
        if(cmtSongId===song.id && ppCmtList.dataset.done!=="1") loadComments(song);
      }, 15000);
    }
  }
}

  foliaView = !foliaView;
  store.set('yy_folia', foliaView);
  applyView();
});

/* ---------- State memory ---------- */
function saveState(s, pos){
  store.set('yy_state',{
    id:s.id, name:s.name, artist:s.artist, pic:s.pic||"", url:s.url||"", lrc:s.lrc||"",
    pos: pos||0, vol: audio.volume, mode: playMode, t: Date.now()
  });
}
function tryRestore(){
  if(pendingRestore) return;
  const st = store.get('yy_state',null);
  if(!st || !st.id || !st.name) return;
  pendingRestore = st;
  // 恢复音量和模式
  if(typeof st.vol === "number") applyVolume(st.vol);
  if(typeof st.mode === "number" && st.mode!==playMode){
    playMode = st.mode;
    modeBtn.innerHTML = modeIcons[playMode];
    modeBtn.classList.toggle("active",playMode!==0);
  }
  // 在当前列表里找这首歌
  const idx = songs.findIndex(x=>key(x)===key(st));
  if(idx>=0){
    toast(`继续播放：${st.name}`);
    pendingSeek = st.pos || 0;
    restoring = true;
    playSong(idx);
  }
  pendingRestore = null;
}

/* ---------- Media Session ---------- */
function setMediaSession(s){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name,
      artist: s.artist,
      album: "云音播放器",
      artwork: s.pic ? [{src:s.pic, sizes:"512x512", type:"image/jpeg"}] : []
    });
    navigator.mediaSession.setActionHandler("play",()=>audio.play());
    navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack",()=>prevSong());
    navigator.mediaSession.setActionHandler("nexttrack",()=>nextSong());
    navigator.mediaSession.setActionHandler("seekbackward",()=>{audio.currentTime=Math.max(0,audio.currentTime-10)});
    navigator.mediaSession.setActionHandler("seekforward",()=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)});
    try{ navigator.mediaSession.setActionHandler("seekto",(d)=>{ if(d && d.seekTime!=null && isFinite(d.seekTime)) audio.currentTime = d.seekTime; }); }catch(e){}
  }catch(e){}
}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 新 SW 接管后自动刷新一次，避免手机端一直停留在旧版本（修复"唱片打不开播放页"等版本滞后问题）
  // 仅在已有旧 SW 控制的会话才监听：首次访问内容由网络直接返回，无需重载
  if(navigator.serviceWorker.controller){
    let __yyReloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(__yyReloaded) return;
      __yyReloaded = true;
      location.reload();
    });
  }
}

/* ---------- Init ---------- */
renderCharts();
renderWall();
// 启动：恢复上次的视图模式（列表/沉浸），再加载默认榜单
applyView();
loadChart(0);
</script>
